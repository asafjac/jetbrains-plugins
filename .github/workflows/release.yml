name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew buildPlugin --stacktrace

      # A tag push already carries its name; a manual run supplies one as input.
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # --clobber so re-running a release replaces its assets rather than failing on a
          # name collision, which otherwise leaves a release published but empty.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            plugins/*/build/distributions/*.zip \
          || gh release upload "$TAG" plugins/*/build/distributions/*.zip --clobber

      # updatePlugins.xml is what makes the repo installable as a custom plugin repository:
      # the IDE polls it, sees a newer version, and offers the update in-place. It must point
      # at the release just published, so it is regenerated here rather than maintained by
      # hand - a stale descriptor silently pins everyone to an old build.
      - name: Point plugin repository at this release
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${TAG#v}"
          ZIP="$(basename plugins/*/build/distributions/*.zip)"
          SINCE="$(grep '^pluginSinceBuild=' gradle.properties | cut -d= -f2)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"

          git fetch origin main
          git checkout -B main origin/main

          cat > updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Custom plugin repository descriptor.

            Add the raw URL of this file under Settings > Plugins > gear > Manage Plugin
            Repositories, and the IDE installs and updates these plugins like any Marketplace
            plugin - no manual zip.

            Regenerated by .github/workflows/release.yml on every release; do not hand-edit.
          -->
          <plugins>
            <plugin id="com.asafjac.jbplugins.registry-navigator"
                    url="${URL}"
                    version="${VERSION}">
              <name>Registry Navigator</name>
              <idea-version since-build="${SINCE}"/>
            </plugin>
          </plugins>
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updatePlugins.xml
          git diff --quiet --cached || git commit -m "chore: point plugin repository at ${TAG}"
          git push origin main
