name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.9.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew buildPlugin --stacktrace

      # A tag push already carries its name; a manual run supplies one as input.
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # --clobber so re-running a release replaces its assets rather than failing on a name
          # collision, which otherwise leaves a release published but empty.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            plugins/*/build/distributions/*.zip \
          || gh release upload "$TAG" plugins/*/build/distributions/*.zip --clobber

      # updatePlugins.xml is what makes this repo installable as a plugin repository: the IDE
      # polls it, sees a newer version, and offers the update in place.
      #
      # Generated from whatever was actually built, not from a hardcoded list. The first version
      # of this step named one plugin literally, so the second plugin shipped in the release
      # assets and yet never appeared in anyone's IDE.
      - name: Point plugin repository at this release
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          SINCE="$(grep '^pluginSinceBuild=' gradle.properties | cut -d= -f2)"

          git fetch origin main
          git checkout -B main origin/main

          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!--'
            printf '%s\n' '  Custom plugin repository descriptor.'
            printf '%s\n' ''
            printf '%s\n' '  Add the raw URL of this file under Settings > Plugins > gear > Manage'
            printf '%s\n' '  Plugin Repositories, and the IDE installs and updates every plugin'
            printf '%s\n' '  listed here like a Marketplace plugin, with no manual zip.'
            printf '%s\n' ''
            printf '%s\n' '  Generated by .github/workflows/release.yml on release; do not hand-edit.'
            printf '%s\n' '-->'
            printf '%s\n' '<plugins>'

            for zip in plugins/*/build/distributions/*.zip; do
              [ -f "$zip" ] || continue
              file="$(basename "$zip")"
              # demo-driver-0.1.0.zip -> module demo-driver, version 0.1.0
              module="$(basename "$(dirname "$(dirname "$(dirname "$zip")")")")"
              version="${file#"$module-"}"
              version="${version%.zip}"
              xml="plugins/$module/src/main/resources/META-INF/plugin.xml"
              id="$(sed -n 's|.*<id>\(.*\)</id>.*|\1|p' "$xml" | head -1)"
              name="$(sed -n 's|.*<name>\(.*\)</name>.*|\1|p' "$xml" | head -1)"
              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${file}"

              printf '  <plugin id="%s"\n' "$id"
              printf '          url="%s"\n' "$url"
              printf '          version="%s">\n' "$version"
              printf '    <name>%s</name>\n' "$name"
              printf '    <idea-version since-build="%s"/>\n' "$SINCE"
              printf '%s\n' '  </plugin>'
              echo "listed $name $version ($id)" >&2
            done

            printf '%s\n' '</plugins>'
          } > updatePlugins.xml

          cat updatePlugins.xml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updatePlugins.xml
          git diff --quiet --cached || git commit -m "chore: point plugin repository at ${TAG}"
          git push origin main
