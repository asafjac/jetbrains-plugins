# The IDE the plugins are compiled against when no local install is configured.
# Override with `localIdePath` in local.properties (gitignored) to build against the IDE
# you actually run - far faster than downloading a platform.
# WS = WebStorm, IU = IDEA Ultimate, IC = IDEA Community, PY = PyCharm Professional.
platformType=WS
platformVersion=2025.2

# The oldest IDE build the plugins declare support for. 252 == 2025.2.
#
# Deliberately lower than the platform we compile against (262), which the config verifier
# warns about. Accepted because an IDE silently refuses to load a plugin whose sinceBuild is
# above its own build number, and "installed but never loaded" is very hard to tell apart
# from "loaded but broken". The APIs in use - GotoDeclarationHandler, the JS PSI, StubIndex -
# have been stable across many releases, so the risk is low and the failure it prevents is
# expensive. Raise it if a genuinely newer API gets used.
pluginSinceBuild=252

# JDK used to COMPILE. Must satisfy the platform above: 2026.2 needs 25, 2025.x needs 21.
# Override in local.properties when building against a newer local IDE.
javaToolchain=21

# Bytecode level EMITTED. Must not exceed the JVM of the oldest IDE in the supported range
# (pluginSinceBuild), or that IDE loads the plugin and then dies with
# UnsupportedClassVersionError. 2025.2 ships JBR 21, so 21.
jvmTarget=21

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.parallel=true
kotlin.stdlib.default.dependency=false
